<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OUR WORLD ❤️</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  overflow:hidden;
}

/* ===== INTRO ===== */
#intro {
  position:fixed;
  width:100%;
  height:100%;
  background:#220000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  z-index:5000;
}

#intro::before{
  content:"❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️";
  position:absolute;
  font-size:90px;
  opacity:0.04;
}

#intro h1{
  z-index:2;
  font-size:28px;
}

#enterBtn{
  margin-top:20px;
  padding:14px 28px;
  background:#8b0000;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

/* ===== MAP ===== */
#map{
  height:100%;
  width:100%;
}

/* ===== ADD PANEL ===== */
#addPanel{
  position:fixed;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:400px;
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  z-index:4000;
  display:none;
}

#addPanel input, #addPanel textarea, #addPanel select{
  width:100%;
  margin-bottom:10px;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

#addPanel button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* ===== POPUP ===== */
.leaflet-popup-content{
  width:260px !important;
}

.popup-img{
  width:100%;
  max-height:200px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:8px;
}

/* ===== LOCATION LIST ===== */
#locationList{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  max-height:30%;
  background:white;
  overflow-y:auto;
  border-top:1px solid #ddd;
  padding:10px;
  z-index:3000;
}

.location-item{
  padding:6px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.location-item:hover{
  background:#f5f5f5;
}
</style>
</head>
<body>

<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <button id="enterBtn">Enter Our World</button>
</div>

<div id="map"></div>

<div id="addPanel">
  <h3>Add a Memory</h3>
  <input type="text" id="placeName" placeholder="Place name">
  <textarea id="description" placeholder="Description"></textarea>
  <input type="file" id="photoInput" accept="image/*">
  <select id="iconSelect">
    <option value="❤️">❤️</option>
    <option value="🍔">🍔</option>
    <option value="✈️">✈️</option>
  </select>
  <button id="saveBtn">Save</button>
  <button onclick="closeAdd()">Cancel</button>
</div>

<div id="locationList">
  <h3>Our Places ✈️</h3>
  <div id="locationsContainer"></div>
</div>

<script>
let map;
let markers = [];
let selectedLatLng = null;

/* ===== SAFE INIT ===== */
window.onload = function(){
  document.getElementById("enterBtn").onclick = startApp;
};

function startApp(){
  document.getElementById("intro").style.display="none";

  setTimeout(()=>{
    initMap();
  },100);
}

/* ===== INIT MAP ===== */
function initMap(){
  if(map) return;

  map = L.map('map',{zoomControl:true}).setView([20,0],2);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OpenStreetMap'}
  ).addTo(map);

  loadMarkers();

  map.on('click', function(e){
    selectedLatLng = e.latlng;
    document.getElementById("addPanel").style.display="block";
  });
}

/* ===== CLOSE PANEL ===== */
function closeAdd(){
  document.getElementById("addPanel").style.display="none";
}

/* ===== SAVE ===== */
document.getElementById("saveBtn").onclick = function(){

  const name = placeName.value.trim();
  const desc = description.value.trim();
  const file = photoInput.files[0];
  const icon = iconSelect.value;

  if(!name || !selectedLatLng) return;

  this.innerText="Saving...";
  this.disabled=true;

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      storeMemory(name,desc,e.target.result,icon);
    };
    reader.readAsDataURL(file);
  }else{
    storeMemory(name,desc,null,icon);
  }
};

function storeMemory(name,desc,img,icon){

  markers.push({
    name:name,
    desc:desc,
    image:img,
    lat:selectedLatLng.lat,
    lng:selectedLatLng.lng,
    icon:icon
  });

  localStorage.setItem("ourWorldMemories",JSON.stringify(markers));

  renderMarkers();

  saveBtn.innerText="Save";
  saveBtn.disabled=false;
  closeAdd();
}

/* ===== LOAD ===== */
function loadMarkers(){
  const saved = localStorage.getItem("ourWorldMemories");
  if(saved){
    markers = JSON.parse(saved);
  }
  renderMarkers();
}

/* ===== RENDER ===== */
function renderMarkers(){

  map.eachLayer(layer=>{
    if(layer instanceof L.Marker) map.removeLayer(layer);
  });

  locationsContainer.innerHTML="";

  markers.forEach((m,i)=>{

    const icon = L.divIcon({
      html:`<div style="font-size:18px;">${m.icon}</div>`,
      className:'',
      iconSize:[24,24]
    });

    const marker = L.marker([m.lat,m.lng],{icon}).addTo(map);

    marker.on('click',()=>{
      const content = `
        <h3>${m.name}</h3>
        ${m.image ? `<img src="${m.image}" class="popup-img">` : ''}
        <p>${m.desc}</p>
        <button onclick="editMemory(${i})">Edit</button>
        <button onclick="deleteMemory(${i})">Delete</button>
      `;
      marker.bindPopup(content,{maxWidth:280}).openPopup();
    });

    const item=document.createElement("div");
    item.className="location-item";
    item.innerText=m.name;
    item.onclick=()=>map.setView([m.lat,m.lng],6);
    locationsContainer.appendChild(item);
  });
}

/* ===== DELETE ===== */
function deleteMemory(i){
  markers.splice(i,1);
  localStorage.setItem("ourWorldMemories",JSON.stringify(markers));
  renderMarkers();
}

/* ===== EDIT ===== */
function editMemory(i){
  const m = markers[i];
  selectedLatLng = {lat:m.lat,lng:m.lng};
  placeName.value=m.name;
  description.value=m.desc;
  iconSelect.value=m.icon;
  deleteMemory(i);
  addPanel.style.display="block";
}
</script>

</body>
</html>
