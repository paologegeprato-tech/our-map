<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Our World ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family: Arial, sans-serif;
  overflow:hidden;
}

/* Intro */
#intro {
  position:fixed;
  width:100%;
  height:100%;
  background:#3b0000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:9999;
  text-align:center;
}

#enterBtn {
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}

/* Map */
#map {
  height:100%;
  width:100%;
}

/* Side Panel */
#sidePanel {
  position:fixed;
  top:10px;
  right:10px;
  width:220px;
  max-height:80%;
  overflow:auto;
  background:white;
  border-radius:15px;
  padding:10px;
  z-index:800;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.memoryItem {
  padding:6px;
  border-bottom:1px solid #eee;
  cursor:pointer;
  font-size:14px;
}

/* Popup styling */
.leaflet-popup-content-wrapper {
  border-radius:15px;
  width:260px !important;
}

.popup-img {
  width:100%;
  max-height:150px;
  object-fit:contain;
  border-radius:10px;
}

.iconChoice {
  font-size:20px;
  cursor:pointer;
  margin:5px;
}

.saveBtn, .deleteBtn {
  margin-top:8px;
  padding:8px;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
  width:100%;
}

.saveBtn { background:#ff4d6d; }
.deleteBtn { background:#999; }

</style>
</head>
<body>

<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <button id="enterBtn">Enter Our World</button>
</div>

<div id="map"></div>

<div id="sidePanel">
  <h3>Our Memories</h3>
  <div id="memoryList"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map;
let memories = JSON.parse(localStorage.getItem("memories") || "[]");
let markers = [];
let mapInitialized = false;

document.getElementById("enterBtn").onclick = function(){
  document.getElementById("intro").style.display = "none";
  if(!mapInitialized){
    initMap();
    mapInitialized = true;
  }
};

function initMap(){
  map = L.map('map', {closePopupOnClick:true}).setView([20,0],2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18
  }).addTo(map);

  map.on("click", function(e){
    if(!map._popup){
      openMemoryPopup(e.latlng);
    }
  });

  loadMemories();
}

/* -------- IMAGE COMPRESSION FUNCTION -------- */

function compressImage(file, callback){
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = function(event){
    const img = new Image();
    img.src = event.target.result;
    img.onload = function(){
      const canvas = document.createElement('canvas');
      const maxWidth = 800;
      const scale = maxWidth / img.width;
      canvas.width = maxWidth;
      canvas.height = img.height * scale;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const compressed = canvas.toDataURL("image/jpeg", 0.7);
      callback(compressed);
    }
  };
}

/* -------- CREATE / EDIT POPUP -------- */

function openMemoryPopup(latlng, existing=null){

  let popupContent = `
    <input id="placeName" placeholder="Place name" style="width:100%;margin-bottom:5px;" value="${existing?existing.name:""}">
    <textarea id="description" placeholder="Description" style="width:100%;height:60px;">${existing?existing.desc:""}</textarea>
    <input type="file" id="photoInput" accept="image/*">
    <div>
      <span class="iconChoice">❤️</span>
      <span class="iconChoice">🍔</span>
      <span class="iconChoice">✈️</span>
    </div>
    <button class="saveBtn">Save</button>
    ${existing?'<button class="deleteBtn">Delete</button>':''}
  `;

  let popup = L.popup({maxWidth:260, autoPan:true})
    .setLatLng(latlng)
    .setContent(popupContent)
    .openOn(map);

  let selectedIcon = existing ? existing.icon : "❤️";

  setTimeout(()=>{

    document.querySelectorAll(".iconChoice").forEach(icon=>{
      icon.onclick=()=> selectedIcon = icon.textContent;
    });

    document.querySelector(".saveBtn").onclick = function(){
      let name = document.getElementById("placeName").value;
      let desc = document.getElementById("description").value;
      let file = document.getElementById("photoInput").files[0];

      if(file){
        compressImage(file, function(compressed){
          saveMemory(latlng,name,desc,compressed,selectedIcon);
        });
      } else {
        saveMemory(latlng,name,desc,existing?existing.image:null,selectedIcon);
      }
    };

    if(existing){
      document.querySelector(".deleteBtn").onclick=function(){
        memories = memories.filter(m=>m.id!==existing.id);
        localStorage.setItem("memories",JSON.stringify(memories));
        loadMemories();
        map.closePopup();
      };
    }

  },100);
}

/* -------- SAVE MEMORY -------- */

function saveMemory(latlng,name,desc,image,icon){

  let memory = {
    id: Date.now(),
    lat:latlng.lat,
    lng:latlng.lng,
    name:name,
    desc:desc,
    image:image,
    icon:icon,
    date:new Date().toLocaleDateString()
  };

  memories.push(memory);
  localStorage.setItem("memories",JSON.stringify(memories));
  loadMemories();
  map.closePopup();
}

/* -------- LOAD MEMORIES -------- */

function loadMemories(){

  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  document.getElementById("memoryList").innerHTML="";

  memories.forEach(mem=>{

    let marker = L.marker([mem.lat,mem.lng],{
      icon:L.divIcon({
        className:"",
        html:`<div style="font-size:16px;">${mem.icon}</div>`,
        iconSize:[20,20]
      })
    }).addTo(map);

    marker.on("click",()=>{
      let content=`
        <h4>${mem.name}</h4>
        ${mem.image?`<img src="${mem.image}" class="popup-img">`:""}
        <p style="font-size:13px;">${mem.desc}</p>
        <small>${mem.date}</small>
      `;
      marker.bindPopup(content,{maxWidth:260}).openPopup();
    });

    markers.push(marker);

    let item = document.createElement("div");
    item.className="memoryItem";
    item.innerText=mem.icon+" "+mem.name;
    item.onclick=()=>map.setView([mem.lat,mem.lng],6);
    document.getElementById("memoryList").appendChild(item);
  });
}

</script>
</body>
</html>
