<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>OUR WORLD ❤️</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family:Arial, sans-serif;
  overflow:hidden;
}

/* Romantic intro */
#intro {
  position:fixed;
  width:100%;
  height:100%;
  background:#200000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
  z-index:3000;
}

#intro::before{
  content:"❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️";
  position:absolute;
  font-size:80px;
  opacity:0.05;
  transform:rotate(-20deg);
}

#intro h1 {
  font-size:30px;
  z-index:2;
}

#enterBtn {
  margin-top:20px;
  padding:12px 24px;
  background:#8b0000;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

#map {
  width:100%;
  height:100%;
}

/* Add panel */
#addPanel {
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  width:90%;
  max-width:400px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
  z-index:2000;
  display:none;
}

#addPanel input, #addPanel textarea {
  width:100%;
  margin-bottom:10px;
  padding:8px;
}

#addPanel button {
  padding:8px;
  margin-right:5px;
}

/* Fixed popup */
.fixed-popup {
  max-width:300px !important;
}

.popup-img {
  width:100%;
  height:auto;
  border-radius:10px;
  object-fit:contain;
}

/* Always visible location list */
#locationList {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  max-height:35%;
  background:white;
  overflow-y:auto;
  border-top:2px solid #ccc;
  z-index:1500;
  padding:10px;
}

#locationList h3 {
  margin:5px 0;
}

.location-item {
  padding:6px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.location-item:hover {
  background:#f3f3f3;
}

/* Small heart marker */
.heart-marker {
  font-size:18px;
}

</style>
</head>
<body>

<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <button id="enterBtn">Enter Our World</button>
</div>

<div id="map"></div>

<div id="addPanel">
  <h3>Add a Memory</h3>
  <input type="text" id="placeName" placeholder="Place name"/>
  <textarea id="description" placeholder="Description"></textarea>
  <input type="file" id="photoInput" accept="image/*"/>
  <select id="iconSelect">
    <option value="❤️">❤️</option>
    <option value="🍔">🍔</option>
    <option value="✈️">✈️</option>
  </select>
  <button id="saveBtn">Save</button>
  <button onclick="closeAdd()">Cancel</button>
</div>

<div id="locationList">
  <h3>Our Places ✈️</h3>
  <div id="locationsContainer"></div>
</div>

<script>

let map;
let markers = [];
let selectedLatLng = null;

/* ===== INTRO FIX ===== */
document.addEventListener("DOMContentLoaded", function(){

  document.getElementById("enterBtn").addEventListener("click", function(){
    document.getElementById("intro").style.display="none";
    initMap();
  });

});

/* ===== INIT MAP ===== */
function initMap(){

  if(map) return; // prevent double init

  map = L.map('map').setView([51.505, -0.09], 3);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'© OpenStreetMap'
  }).addTo(map);

  loadMarkers();

  map.on('click', function(e){
    selectedLatLng = e.latlng;
    document.getElementById("addPanel").style.display="block";
  });
}

/* ===== CLOSE ADD PANEL ===== */
function closeAdd(){
  document.getElementById("addPanel").style.display="none";
}

/* ===== SAVE MEMORY ===== */
document.getElementById("saveBtn").onclick = function(){

  const name = document.getElementById("placeName").value;
  const desc = document.getElementById("description").value;
  const file = document.getElementById("photoInput").files[0];
  const icon = document.getElementById("iconSelect").value;

  if(!name || !selectedLatLng) return;

  this.innerText="Saving...";
  this.disabled=true;

  const reader = new FileReader();

  reader.onload = (e)=>{

    const memory = {
      name:name,
      desc:desc,
      image:e.target.result,
      lat:selectedLatLng.lat,
      lng:selectedLatLng.lng,
      icon:icon
    };

    saveMarker(memory);

    document.getElementById("saveBtn").innerText="Save";
    document.getElementById("saveBtn").disabled=false;
    document.getElementById("addPanel").style.display="none";
  };

  if(file){
    reader.readAsDataURL(file);
  } else {
    reader.onload({target:{result:null}});
  }

};

/* ===== SAVE TO STORAGE ===== */
function saveMarker(memory){
  markers.push(memory);
  localStorage.setItem("ourWorldMemories", JSON.stringify(markers));
  renderMarkers();
}

/* ===== LOAD ===== */
function loadMarkers(){
  const saved = localStorage.getItem("ourWorldMemories");
  if(saved){
    markers = JSON.parse(saved);
  }
  renderMarkers();
}

/* ===== RENDER ===== */
function renderMarkers(){

  if(!map) return;

  map.eachLayer(function(layer){
    if(layer instanceof L.Marker){
      map.removeLayer(layer);
    }
  });

  document.getElementById("locationsContainer").innerHTML="";

  markers.forEach((m,i)=>{

    const icon = L.divIcon({
      html:`<div style="font-size:18px;">${m.icon}</div>`,
      className:'',
      iconSize:[24,24]
    });

    const marker = L.marker([m.lat,m.lng],{icon}).addTo(map);

    marker.on('click', function(){

      const popupContent = `
        <div style="width:260px;">
          <h3 style="margin:5px 0;">${m.name}</h3>
          ${m.image ? `<img src="${m.image}" class="popup-img"/>` : ''}
          <p style="font-size:14px;">${m.desc}</p>
          <button onclick="editMemory(${i})">Edit</button>
          <button onclick="deleteMemory(${i})">Delete</button>
        </div>
      `;

      marker.bindPopup(popupContent, {
        maxWidth:300,
        autoPan:true,
        closeOnClick:true
      }).openPopup();
    });

    /* Location list */
    const item = document.createElement("div");
    item.className="location-item";
    item.innerText = m.name;
    item.onclick = function(){
      map.setView([m.lat,m.lng],8);
    };

    document.getElementById("locationsContainer").appendChild(item);

  });

}

/* ===== DELETE ===== */
function deleteMemory(index){
  markers.splice(index,1);
  localStorage.setItem("ourWorldMemories", JSON.stringify(markers));
  renderMarkers();
}

/* ===== EDIT ===== */
function editMemory(index){
  const m = markers[index];
  selectedLatLng = {lat:m.lat,lng:m.lng};
  document.getElementById("placeName").value=m.name;
  document.getElementById("description").value=m.desc;
  document.getElementById("iconSelect").value=m.icon;
  document.getElementById("addPanel").style.display="block";
  deleteMemory(index);
}

</script>


</body>
</html>
