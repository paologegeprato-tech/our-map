<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR WORLD ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{margin:0;height:100%;background:#0a0e13;color:#f0ebe5;font-family:Arial}
#map{height:100%}
.leaflet-div-icon{background:none;border:none}

/* INTRO */
#intro{
  position:fixed;inset:0;background:#0a0e13;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:3000;text-align:center
}
#intro h1{color:#d4af37;font-size:2.4rem}
#intro p{color:#ccc;max-width:320px}
#intro button{
  margin-top:30px;padding:14px 26px;
  background:#d4af37;border:none;
  font-size:1.1rem;font-weight:bold;
  border-radius:8px;cursor:pointer
}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.92);
  display:none;align-items:center;justify-content:center;
  z-index:2000
}
.modal.active{display:flex}
.modal-content{
  background:#1a1a1a;padding:22px;
  width:90%;max-width:420px;
  border-radius:12px;border:1px solid #d4af37
}
input,textarea{
  width:100%;padding:10px;margin-bottom:12px;
  background:#222;border:1px solid #555;color:#fff;
  border-radius:6px
}
.icon-picker{text-align:center;margin-bottom:12px}
.icon-picker span{font-size:2rem;margin:0 10px;cursor:pointer}
.icon-picker .selected{transform:scale(1.3)}

button{
  width:100%;padding:12px;
  border:none;border-radius:6px;
  font-weight:bold;cursor:pointer
}
.save{background:#d4af37}
.cancel{background:#555;margin-top:8px}
.delete{background:#8b0000;margin-top:8px}

/* POPUP */
.popup img{
  width:100%;
  max-height:160px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:6px;
  cursor:pointer
}
.popup p{margin:0;font-size:.95rem}
.popup button{margin-top:6px}

/* FULL IMAGE */
#viewer{
  position:fixed;inset:0;
  background:rgba(0,0,0,.95);
  display:none;align-items:center;justify-content:center;
  z-index:4000
}
#viewer img{
  max-width:90%;
  max-height:90%;
  border-radius:10px
}
</style>
</head>

<body>

<div id="intro">
  <h1>OUR WORLD ❤️</h1>
  <p>Every place we loved. Every memory we made.</p>
  <button onclick="enterWorld()">Enter Our World ❤️</button>
</div>

<div id="map"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <input id="name" placeholder="Place name">
    <textarea id="desc" placeholder="Why this place matters"></textarea>
    <input type="file" id="photo" accept="image/*">
    <div class="icon-picker">
      <span onclick="pick('🍔')">🍔</span>
      <span onclick="pick('❤️')" class="selected">❤️</span>
      <span onclick="pick('✈️')">✈️</span>
    </div>
    <button class="save" onclick="save()">Save ❤️</button>
    <button class="cancel" onclick="closeModal()">Cancel</button>
    <button class="delete" id="delBtn" onclick="remove()">Delete</button>
  </div>
</div>

<div id="viewer" onclick="this.style.display='none'">
  <img id="viewerImg">
</div>

<script>
/* INTRO FIX */
if(localStorage.entered){
  intro.style.display='none';
  setTimeout(()=>map.invalidateSize(),300);
}
function enterWorld(){
  localStorage.entered=true;
  intro.style.display='none';
  setTimeout(()=>map.invalidateSize(),300);
}

/* MAP */
const map=L.map('map').setView([48,8],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let pins=JSON.parse(localStorage.getItem('pins')||'[]');
let editIndex=null,tempLatLng=null,icon='❤️',imgData=null;

/* ICON */
function pick(i){
  icon=i;
  document.querySelectorAll('.icon-picker span').forEach(s=>s.classList.remove('selected'));
  [...document.querySelectorAll('.icon-picker span')].find(s=>s.textContent===i).classList.add('selected');
}

/* IMAGE */
photo.onchange=e=>{
  const r=new FileReader();
  r.onload=ev=>imgData=ev.target.result;
  r.readAsDataURL(e.target.files[0]);
};

/* MODAL */
map.on('click',e=>{
  editIndex=null;
  tempLatLng=e.latlng;
  delBtn.style.display='none';
  modal.classList.add('active');
});
function closeModal(){
  modal.classList.remove('active');
  imgData=null;
}

/* SAVE */
function save(){
  const data={
    lat:editIndex!==null?pins[editIndex].lat:tempLatLng.lat,
    lng:editIndex!==null?pins[editIndex].lng:tempLatLng.lng,
    name:name.value,desc:desc.value,icon,img:imgData
  };
  if(editIndex!==null)pins[editIndex]=data;
  else pins.push(data);
  localStorage.setItem('pins',JSON.stringify(pins));
  render();
  closeModal();
}

/* DELETE */
function remove(){
  pins.splice(editIndex,1);
  localStorage.setItem('pins',JSON.stringify(pins));
  render();
  closeModal();
}

/* RENDER */
let markers=[];
function render(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  pins.forEach((p,i)=>{
    const m=L.marker([p.lat,p.lng],{
      icon:L.divIcon({
        html:`<div style="font-size:20px">${p.icon}</div>`,
        iconSize:[20,20],iconAnchor:[10,10]
      })
    }).addTo(map);

    m.bindPopup(`
      <div class="popup">
        ${p.img?`<img src="${p.img}" onclick="view('${p.img}')">`:''}
        <strong>${p.name}</strong>
        <p>${p.desc}</p>
        <button onclick="edit(${i})">Edit</button>
      </div>
    `);
    markers.push(m);
  });
}
render();

/* EDIT */
function edit(i){
  editIndex=i;
  const p=pins[i];
  name.value=p.name;
  desc.value=p.desc;
  imgData=p.img;
  pick(p.icon);
  delBtn.style.display='block';
  modal.classList.add('active');
}

/* VIEW IMAGE */
function view(src){
  viewerImg.src=src;
  viewer.style.display='flex';
}
</script>

</body>
</html>
