<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Our World ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
html,body{margin:0;padding:0;height:100%;font-family:Arial,sans-serif;overflow:hidden;}
#intro{position:fixed;width:100%;height:100%;background:#3b0000;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:9999;text-align:center;}
#enterBtn{padding:12px 25px;font-size:18px;border:none;border-radius:30px;background:#ff4d6d;color:white;cursor:pointer;}
#enterBtn:hover{background:#ff6382;}
#map{height:100%;width:100%;}
#sidePanel{position:fixed;top:10px;right:10px;width:230px;max-height:80%;overflow:auto;background:white;border-radius:15px;padding:10px;box-shadow:0 4px 10px rgba(0,0,0,0.2);z-index:800;}
.memoryItem{padding:6px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px;}
.memoryItem:hover{background:#f8f8f8;}
.leaflet-popup-content-wrapper{border-radius:15px;width:260px!important;}
.popup-img{width:100%;max-height:150px;object-fit:contain;border-radius:10px;}
.saveBtn,.deleteBtn{margin-top:8px;padding:8px;border:none;color:white;border-radius:8px;cursor:pointer;width:100%;}
.saveBtn{background:#ff4d6d;} .saveBtn:hover{background:#ff6382;}
.deleteBtn{background:#999;} .deleteBtn:hover{background:#aaa;}
.iconChoice{font-size:20px;cursor:pointer;margin:5px;}
.iconChoice.selected{text-shadow:0 0 5px #ff4d6d;}
.heart{position:absolute;font-size:22px;animation:floatUp .8s ease-out forwards;pointer-events:none;z-index:1000;}
@keyframes floatUp{0%{transform:translateY(0)scale(1);opacity:1;}100%{transform:translateY(-50px)scale(1.5);opacity:0;}}
#savingOverlay{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.5);color:white;font-size:20px;z-index:2000;display:none;}
.heartbeat{animation:beat .6s infinite alternate;}
@keyframes beat{from{transform:scale(1);}to{transform:scale(1.3);}}
</style>
</head>
<body>
<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <button id="enterBtn">Enter Our World</button>
</div>

<div id="map"></div>

<div id="sidePanel">
  <h3>Our Memories</h3>
  <div id="memoryList"></div>
</div>

<div id="savingOverlay"><span class="heartbeat">💾</span></div>
