<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR WORLD ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
  margin:0; height:100%;
  background:#0a0e13; color:#f0ebe5;
  font-family:Arial,sans-serif;
}

#intro {
  position:fixed; inset:0;
  background:#0a0e13;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:3000; text-align:center;
}
#intro h1 { color:#d4af37; font-size:2.4rem; }
#intro p { color:#ccc; max-width:320px; }
#intro button {
  margin-top:30px; padding:14px 26px;
  background:#d4af37; border:none;
  font-weight:bold; font-size:1.1rem;
  border-radius:8px; cursor:pointer;
}

.header {
  padding:16px;
  text-align:center;
  background:#1a1a1a;
  border-bottom:1px solid #333;
}
.header h1 { margin:0; color:#d4af37; }

#map { height:calc(100% - 70px); }

/* MODAL */
.modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,.95);
  display:none; align-items:center; justify-content:center;
  z-index:2000;
}
.modal.active { display:flex; }

.modal-content {
  background:#1a1a1a;
  padding:28px;
  width:90%; max-width:420px;
  border-radius:12px;
  border:1px solid #d4af37;
}

input, textarea {
  width:100%; margin-bottom:12px;
  padding:10px;
  background:#222;
  border:1px solid #555;
  color:#fff;
  border-radius:6px;
}

.icon-picker {
  text-align:center;
  margin-bottom:16px;
}
.icon-picker span {
  font-size:1.8rem;
  margin:0 12px;
  cursor:pointer;
}
.icon-picker span.selected {
  transform:scale(1.3);
}

button {
  width:100%;
  padding:14px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}
button.save { background:#d4af37; }
button.cancel { background:#555; margin-top:10px; }
button:disabled { opacity:.6; cursor:not-allowed; }

/* POPUP STYLE */
.leaflet-popup-content {
  margin:0;
}
.popup {
  max-width:220px;
}
.popup img {
  width:100%;
  max-height:160px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:8px;
}
.popup h3 {
  margin:0 0 6px 0;
  color:#d4af37;
  font-size:1rem;
}
.popup p {
  margin:0;
  font-size:.9rem;
  color:#ddd;
}

/* FIX ICON WHITE BOX */
.emoji-marker {
  background:transparent !important;
  border:none !important;
}
</style>
</head>

<body>

<div id="intro">
  <h1>OUR WORLD ❤️</h1>
  <p>Every place we loved. Every memory we made.</p>
  <button onclick="enterWorld()">Enter Our World ❤️</button>
</div>

<div class="header"><h1>OUR WORLD ❤️</h1></div>
<div id="map"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 style="color:#d4af37;">Add Memory</h2>
    <input id="name" placeholder="Place name">
    <textarea id="desc" placeholder="Why this place matters"></textarea>
    <input type="file" id="photo" accept="image/*">

    <div class="icon-picker">
      <span onclick="selectIcon('🍔')">🍔</span>
      <span onclick="selectIcon('❤️')" class="selected">❤️</span>
      <span onclick="selectIcon('✈️')">✈️</span>
    </div>

    <button class="save" id="saveBtn" onclick="savePin()">Save ❤️</button>
    <button class="cancel" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
if(localStorage.getItem('entered')) intro.style.display='none';
function enterWorld(){ localStorage.setItem('entered','yes'); intro.style.display='none'; }

const map = L.map('map').setView([48,8],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let pins = JSON.parse(localStorage.getItem('pins')||'[]');
let tempLatLng, selectedIcon='❤️', imageData=null;

map.on('click', e=>{
  tempLatLng=e.latlng;
  modal.classList.add('active');
});

function closeModal(){
  modal.classList.remove('active');
  imageData=null;
}

function selectIcon(icon){
  selectedIcon=icon;
  document.querySelectorAll('.icon-picker span').forEach(s=>s.classList.remove('selected'));
  [...document.querySelectorAll('.icon-picker span')]
    .find(s=>s.textContent===icon)
    .classList.add('selected');
}

photo.addEventListener('change', e=>{
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const max=650;
      let w=img.width,h=img.height;
      if(w>h&&w>max){h*=max/w;w=max}
      else if(h>max){w*=max/h;h=max}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      imageData=c.toDataURL('image/jpeg',0.7);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(e.target.files[0]);
});

function savePin(){
  saveBtn.textContent='Saving...';
  saveBtn.disabled=true;

  setTimeout(()=>{
    const pin={lat:tempLatLng.lat,lng:tempLatLng.lng,name:name.value,desc:desc.value,icon:selectedIcon,img:imageData};
    pins.push(pin);
    localStorage.setItem('pins',JSON.stringify(pins));
    addMarker(pin);
    saveBtn.textContent='Save ❤️';
    saveBtn.disabled=false;
    closeModal();
  },250);
}

function addMarker(p){
  const icon=L.divIcon({
    className:'emoji-marker',
    iconSize:[26,26],
    html:`<div style="font-size:1.5rem;">${p.icon}</div>`
  });

  const popupHtml=`
    <div class="popup">
      ${p.img?`<img src="${p.img}">`:''}
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
    </div>
  `;

  L.marker([p.lat,p.lng],{icon})
    .addTo(map)
    .bindPopup(popupHtml);
}

pins.forEach(addMarker);
</script>

</body>
</html>
