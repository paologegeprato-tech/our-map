<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Our World ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{margin:0;padding:0;height:100%;font-family:Arial,sans-serif;overflow:hidden;}
#intro{position:fixed;width:100%;height:100%;background:#3b0000;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:9999;text-align:center;}
#enterBtn{padding:12px 25px;font-size:18px;border:none;border-radius:30px;background:#ff4d6d;color:white;cursor:pointer;}
#enterBtn:hover{background:#ff6382;}
#map{height:100%;width:100%;}
#sidePanel{position:fixed;top:46px;right:10px;width:230px;max-height:78%;overflow:auto;background:white;border-radius:15px;padding:10px;box-shadow:0 4px 10px rgba(0,0,0,0.2);z-index:800;}
.memoryItem{padding:6px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px;}
.memoryItem:hover{background:#f8f8f8;}
.leaflet-popup-content-wrapper{border-radius:15px;width:260px!important;}
.popup-img{width:100%;max-height:150px;object-fit:contain;border-radius:10px;}
.saveBtn,.deleteBtn{margin-top:8px;padding:8px;border:none;color:white;border-radius:8px;cursor:pointer;width:100%;}
.saveBtn{background:#ff4d6d;}
.saveBtn:hover{background:#ff6382;}
.deleteBtn{background:#999;}
.deleteBtn:hover{background:#aaa;}
.iconChoice{font-size:20px;cursor:pointer;margin:5px;}
.iconChoice.selected{text-shadow:0 0 5px #ff4d6d;}
#savingOverlay{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.5);color:white;font-size:20px;z-index:2000;display:none;}
.heartbeat{animation:beat .6s infinite alternate;}
@keyframes beat{from{transform:scale(1);}to{transform:scale(1.3);}}

/* storage status bar */
#storageStatus{
  position:fixed;left:0;top:0;width:100%;
  padding:10px 12px;
  background:#111;color:#fff;
  z-index:9000;
  font-size:14px;
  box-sizing:border-box;
  opacity:0.95;
}
#storageStatus strong{color:#ff4d6d;}
</style>
</head>

<body>

<div id="storageStatus">Checking storage...</div>

<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <button id="enterBtn">Enter Our World</button>
</div>

<div id="map"></div>

<div id="sidePanel">
  <h3>Our Memories</h3>
  <div id="memoryList"></div>
</div>

<div id="savingOverlay"><span class="heartbeat">💾</span></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* ===================== GLOBAL ERROR POPUPS (so nothing is hidden) ===================== */
window.addEventListener("unhandledrejection", (e) => {
  alert("Unhandled promise error: " + (e.reason?.message || e.reason));
});
window.addEventListener("error", (e) => {
  alert("JS error: " + (e.message || e.error));
});

/* ===================== UI HELPERS ===================== */
function showSavingOverlay(show, text) {
  const o = document.getElementById("savingOverlay");
  o.style.display = show ? "flex" : "none";
  if (show) o.innerHTML = `<span class="heartbeat">${text || "Working..."}</span>`;
}

function setStorageStatus(msg) {
  document.getElementById("storageStatus").innerHTML = msg;
}

/* ===================== STORAGE LAYER (IndexedDB with localStorage fallback) ===================== */
const DB_NAME = "ourworld_local";
const DB_VERSION = 1;
const STORE = "memories";
const LS_KEY = "ourworld_memories_v1";

let storageMode = "unknown"; // "indexeddb" | "localstorage" | "blocked"

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// quick self-test: can we open IDB and write a tiny record?
async function testIndexedDB() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    const os = tx.objectStore(STORE);
    os.put({ id: "__test__", t: Date.now(), ok: true });
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function testLocalStorage() {
  const k = "__ls_test__";
  localStorage.setItem(k, "1");
  const v = localStorage.getItem(k);
  localStorage.removeItem(k);
  return v === "1";
}

async function initStorage() {
  // Prefer IndexedDB
  try {
    await testIndexedDB();
    storageMode = "indexeddb";
    setStorageStatus(`Storage: <strong>IndexedDB</strong> (best)`);
    return;
  } catch (e) {
    console.warn("IndexedDB not usable:", e);
  }

  // Fallback: localStorage
  try {
    if (testLocalStorage()) {
      storageMode = "localstorage";
      setStorageStatus(`Storage: <strong>localStorage</strong> (text + small photos only)`);
      return;
    }
  } catch (e) {
    console.warn("localStorage not usable:", e);
  }

  storageMode = "blocked";
  setStorageStatus(`Storage: <strong>BLOCKED</strong>. iPhone settings are preventing saving.`);
}

/* ---- localStorage helpers ---- */
function lsReadAll() {
  const raw = localStorage.getItem(LS_KEY);
  if (!raw) return [];
  try { return JSON.parse(raw) || []; } catch { return []; }
}
function lsWriteAll(arr) {
  localStorage.setItem(LS_KEY, JSON.stringify(arr));
}

/* ---- public storage API used by app ---- */
async function saveMemoryRecord(mem) {
  if (storageMode === "indexeddb") {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(mem);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  if (storageMode === "localstorage") {
    const all = lsReadAll();
    const idx = all.findIndex(x => x.id === mem.id);
    if (idx >= 0) all[idx] = mem; else all.push(mem);
    lsWriteAll(all);
    return;
  }

  throw new Error("Storage is blocked on this device/browser.");
}

async function getAllMemoryRecords() {
  if (storageMode === "indexeddb") {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve((req.result || []).filter(x => x.id !== "__test__"));
      req.onerror = () => reject(req.error);
    });
  }

  if (storageMode === "localstorage") {
    return lsReadAll();
  }

  throw new Error("Storage is blocked on this device/browser.");
}

async function deleteMemoryRecord(id) {
  if (storageMode === "indexeddb") {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  if (storageMode === "localstorage") {
    const all = lsReadAll().filter(x => x.id !== id);
    lsWriteAll(all);
    return;
  }

  throw new Error("Storage is blocked on this device/browser.");
}

/* ===================== FAST PHOTO COMPRESSION (iPhone) ===================== */
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label || "Timed out")), ms))
  ]);
}

function dataURLToBlob(dataURL) {
  const parts = dataURL.split(",");
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8 = new Uint8Array(n);
  while (n--) u8[n] = bstr.charCodeAt(n);
  return new Blob([u8], { type: mime });
}

async function canvasToJpegData(canvas, quality) {
  // We store as base64 if using localStorage fallback (because it can't store Blobs/Files)
  const dataURL = canvas.toDataURL("image/jpeg", quality);
  return dataURL;
}

async function canvasToJpegBlob(canvas, quality) {
  const blob = await new Promise(resolve => {
    if (!canvas.toBlob) return resolve(null);
    canvas.toBlob(b => resolve(b), "image/jpeg", quality);
  });
  if (blob) return blob;

  // iOS fallback
  const dataURL = canvas.toDataURL("image/jpeg", quality);
  return dataURLToBlob(dataURL);
}

async function compressForSpeed(file) {
  // Tuned for speed in popups
  const MAX_WIDTH = 420;
  const QUALITY = 0.33;

  const img = new Image();
  img.src = URL.createObjectURL(file);
  await withTimeout(img.decode(), 6000, "Photo decode took too long");

  const scale = Math.min(1, MAX_WIDTH / img.width);
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.drawImage(img, 0, 0, w, h);

  URL.revokeObjectURL(img.src);

  if (storageMode === "localstorage") {
    // localStorage can only store strings, so store compressed base64
    const dataURL = await withTimeout(canvasToJpegData(canvas, QUALITY), 6000, "Photo compression took too long");
    return { kind: "dataurl", dataURL };
  }

  // IndexedDB can store Blobs/Files
  const blob = await withTimeout(canvasToJpegBlob(canvas, QUALITY), 6000, "Photo compression took too long");
  return { kind: "blob", blob };
}

/* ===================== APP ===================== */
let map;
let markers = [];

document.getElementById("enterBtn").onclick = async () => {
  document.getElementById("intro").style.display = "none";
  initMap();
};

function initMap() {
  map = L.map("map").setView([20, 0], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
  map.on("click", e => openMemoryPopup(e.latlng));
  loadMemories();
}

function openMemoryPopup(latlng) {
  const html = `
    <input id="placeName" placeholder="Place name" style="width:100%;margin-bottom:5px;">
    <textarea id="description" placeholder="Description" style="width:100%;height:60px;"></textarea>
    <input type="file" id="photoInput" accept="image/*">
    <div>
      <span class="iconChoice selected">❤️</span>
      <span class="iconChoice">🍔</span>
      <span class="iconChoice">✈️</span>
    </div>
    <button class="saveBtn">Save</button>
  `;
  L.popup({ maxWidth: 260, autoPan: true }).setLatLng(latlng).setContent(html).openOn(map);
  map.once("popupopen", () => initPopupEvents(latlng));
}

function initPopupEvents(latlng) {
  let selectedIcon = "❤️";

  document.querySelectorAll(".iconChoice").forEach(ic => {
    ic.onclick = () => {
      document.querySelectorAll(".iconChoice").forEach(i => i.classList.remove("selected"));
      ic.classList.add("selected");
      selectedIcon = ic.textContent;
    };
  });

  document.querySelector(".saveBtn").onclick = async () => {
    const name = document.getElementById("placeName").value.trim();
    const desc = document.getElementById("description").value.trim();
    const file = document.getElementById("photoInput").files[0];

    if (!name && !desc && !file) {
      alert("Please add something to save.");
      return;
    }

    await saveMemory(latlng, name, desc, file || null, selectedIcon);
  };
}

async function saveMemory(latlng, name, desc, file, icon) {
  try {
    if (storageMode === "blocked") {
      throw new Error("Your iPhone is blocking website storage. See note below after you paste this code.");
    }

    const id = (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2);

    const record = {
      id,
      lat: latlng.lat,
      lng: latlng.lng,
      name,
      desc,
      icon,
      date: new Date().toLocaleDateString(),
      // image stored in one of these forms:
      imageKind: null,
      imageDataURL: null,
      imageBlob: null
    };

    if (file) {
      showSavingOverlay(true, "Processing photo...");
      const out = await compressForSpeed(file);

      if (out.kind === "dataurl") {
        record.imageKind = "dataurl";
        record.imageDataURL = out.dataURL;
      } else {
        record.imageKind = "blob";
        record.imageBlob = out.blob;
      }
    }

    showSavingOverlay(true, "Saving...");
    await saveMemoryRecord(record);

    showSavingOverlay(false);
    await loadMemories();
    map.closePopup();
  } catch (err) {
    console.error(err);
    showSavingOverlay(false);
    alert("Save failed: " + (err.message || err));
  }
}

async function loadMemories() {
  if (!map) return;

  markers.forEach(m => map.removeLayer(m));
  markers = [];
  document.getElementById("memoryList").innerHTML = "";

  let memories = [];
  try {
    memories = await getAllMemoryRecords();
  } catch (e) {
    console.error(e);
    alert("Could not load saved memories: " + (e.message || e));
    return;
  }

  // newest first
  memories = memories
    .filter(m => m && m.id && m.id !== "__test__")
    .reverse();

  memories.forEach(mem => {
    const lat = Number(mem.lat);
    const lng = Number(mem.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

    const marker = L.marker([lat, lng], {
      icon: L.divIcon({
        className: "",
        html: `<div style="font-size:16px;">${mem.icon || "📍"}</div>`,
        iconSize: [20, 20]
      })
    }).addTo(map);

    marker.on("click", () => {
      let imgHTML = "";
      let blobURL = null;

      if (mem.imageKind === "dataurl" && mem.imageDataURL) {
        imgHTML = `<img src="${mem.imageDataURL}" class="popup-img">`;
      } else if (mem.imageKind === "blob" && mem.imageBlob) {
        blobURL = URL.createObjectURL(mem.imageBlob);
        imgHTML = `<img src="${blobURL}" class="popup-img">`;
      }

      const content = `
        <h4>${escapeHTML(mem.name || "Untitled Place")}</h4>
        ${imgHTML}
        <p>${escapeHTML(mem.desc || "")}</p>
        <small>${escapeHTML(mem.date || "")}</small>
        <button class="deleteBtn" data-id="${mem.id}">Delete</button>
      `;

      marker.bindPopup(content, { maxWidth: 260 }).openPopup();

      setTimeout(() => {
        const btn = document.querySelector(`.deleteBtn[data-id="${cssEscape(mem.id)}"]`);
        if (btn) {
          btn.onclick = async () => {
            if (!confirm("Delete this memory?")) return;
            await deleteMemoryRecord(mem.id);
            await loadMemories();
            map.closePopup();
          };
        }
      }, 0);

      marker.once("popupclose", () => {
        if (blobURL) URL.revokeObjectURL(blobURL);
      });
    });

    markers.push(marker);

    const item = document.createElement("div");
    item.className = "memoryItem";
    item.innerText = `${mem.icon || "📍"} ${mem.name || "Untitled Place"}`;
    item.onclick = () => map.setView([lat, lng], 6);
    document.getElementById("memoryList").appendChild(item);
  });
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}
function cssEscape(value) {
  if (window.CSS && CSS.escape) return CSS.escape(value);
  return String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
}

/* ===================== STARTUP ===================== */
(async function start() {
  await initStorage();

  // If storage is blocked, tell you the most likely iPhone setting causing it
  if (storageMode === "blocked") {
    setStorageStatus(
      `Storage: <strong>BLOCKED</strong>. Check iPhone Settings → Safari → ` +
      `“Block All Cookies” must be OFF, and you must NOT be in Private Browsing.`
    );
  }
})();
</script>
</body>
</html>
