<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Our World ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{margin:0;padding:0;height:100%;font-family:Arial,sans-serif;overflow:hidden;}
#statusBar{
  position:fixed;left:0;top:0;width:100%;
  background:#111;color:#fff;opacity:0.92;
  z-index:9000;padding:10px 12px;box-sizing:border-box;font-size:14px;
}
#statusBar strong{color:#ff4d6d;}
#intro{position:fixed;width:100%;height:100%;background:#3b0000;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:9999;text-align:center;}
#enterBtn{padding:12px 25px;font-size:18px;border:none;border-radius:30px;background:#ff4d6d;color:white;cursor:pointer;}
#enterBtn:hover{background:#ff6382;}
#map{height:100%;width:100%;}
#sidePanel{position:fixed;top:48px;right:10px;width:230px;max-height:78%;overflow:auto;background:white;border-radius:15px;padding:10px;box-shadow:0 4px 10px rgba(0,0,0,0.2);z-index:800;}
.memoryItem{padding:6px;border-bottom:1px solid #eee;cursor:pointer;font-size:14px;}
.memoryItem:hover{background:#f8f8f8;}
.leaflet-popup-content-wrapper{border-radius:15px;width:260px!important;}
.popup-img{width:100%;max-height:150px;object-fit:contain;border-radius:10px;}
.saveBtn,.deleteBtn{margin-top:8px;padding:8px;border:none;color:white;border-radius:8px;cursor:pointer;width:100%;}
.saveBtn{background:#ff4d6d;}
.saveBtn:hover{background:#ff6382;}
.deleteBtn{background:#999;}
.deleteBtn:hover{background:#aaa;}
.iconChoice{font-size:20px;cursor:pointer;margin:5px;}
.iconChoice.selected{text-shadow:0 0 5px #ff4d6d;}
#savingOverlay{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.5);color:white;font-size:20px;z-index:2000;display:none;}
.heartbeat{animation:beat .6s infinite alternate;}
@keyframes beat{from{transform:scale(1);}to{transform:scale(1.3);}}
</style>
</head>

<body>
<div id="statusBar">Starting…</div>

<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <button id="enterBtn">Enter Our World</button>
</div>

<div id="map"></div>

<div id="sidePanel">
  <h3>Our Memories</h3>
  <div id="memoryList"></div>
</div>

<div id="savingOverlay"><span class="heartbeat">💾</span></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* ===================== Status + Overlay ===================== */
function setStatus(msg){ document.getElementById("statusBar").innerHTML = msg; }
function showSavingOverlay(show, text) {
  const o = document.getElementById("savingOverlay");
  o.style.display = show ? "flex" : "none";
  if (show) o.innerHTML = `<span class="heartbeat">${text || "Working..."}</span>`;
}

/* ===================== IndexedDB (local only) ===================== */
const DB_NAME = "ourworld_local";
const DB_VERSION = 1;
const STORE = "memories";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(mem) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(mem);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function idbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function storageSelfTest() {
  try {
    const db = await openDB();
    db.close();
    setStatus(`Storage: <strong>OK</strong> (saved on this iPhone/browser)`);
  } catch {
    setStatus(`Storage: <strong>BLOCKED</strong> (iPhone/browser settings)`);
  }
}

/* ===================== Fast iPhone compression -> DATA URL ===================== */
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label || "Timed out")), ms))
  ]);
}

async function compressToDataURL(file) {
  // Fast + small for popups
  const MAX_WIDTH = 420;
  const QUALITY = 0.33;

  const img = new Image();
  img.src = URL.createObjectURL(file);
  await withTimeout(img.decode(), 6000, "Photo decode took too long");

  const scale = Math.min(1, MAX_WIDTH / img.width);
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext("2d", { alpha:false });
  ctx.drawImage(img, 0, 0, w, h);

  URL.revokeObjectURL(img.src);

  // Reliable string on iPhone
  return await withTimeout(
    Promise.resolve(canvas.toDataURL("image/jpeg", QUALITY)),
    6000,
    "Photo compression took too long"
  );
}

/* ===================== App ===================== */
let map;
let markers = [];
const memoryListEl = document.getElementById("memoryList");

document.getElementById("enterBtn").onclick = async () => {
  document.getElementById("intro").style.display = "none";
  initMap();
  await loadMemories();
};

function initMap() {
  map = L.map("map").setView([20, 0], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);
  map.on("click", e => openMemoryPopup(e.latlng));
}

function openMemoryPopup(latlng) {
  const html = `
    <input class="placeName" placeholder="Place name" style="width:100%;margin-bottom:5px;">
    <textarea class="description" placeholder="Description" style="width:100%;height:60px;"></textarea>

    <input type="file" class="photoInput" accept="image/*">
    <div class="photoStatus" style="font-size:12px;color:#555;margin-top:4px;">No photo selected</div>
    <img class="photoPreview popup-img" style="display:none;margin-top:6px;">

    <div>
      <span class="iconChoice selected">❤️</span>
      <span class="iconChoice">🍔</span>
      <span class="iconChoice">✈️</span>
    </div>

    <button class="saveBtn">Save</button>
  `;

  const popup = L.popup({ maxWidth: 260, autoPan: true })
    .setLatLng(latlng)
    .setContent(html);

  popup.openOn(map);

  // Attach handlers using the popup's own element (THIS is the key fix)
  map.once("popupopen", (ev) => {
    const container = ev.popup.getElement();
    if (!container) return;

    let selectedIcon = "❤️";

    const placeNameEl = container.querySelector(".placeName");
    const descEl = container.querySelector(".description");
    const input = container.querySelector(".photoInput");
    const status = container.querySelector(".photoStatus");
    const preview = container.querySelector(".photoPreview");
    const saveBtn = container.querySelector(".saveBtn");

    // Icon selection
    container.querySelectorAll(".iconChoice").forEach(ic => {
      ic.addEventListener("click", () => {
        container.querySelectorAll(".iconChoice").forEach(i => i.classList.remove("selected"));
        ic.classList.add("selected");
        selectedIcon = ic.textContent;
      });
    });

    // Photo preview + status
    input.addEventListener("change", () => {
      const f = input.files && input.files[0];
      if (!f) {
        status.textContent = "No photo selected";
        preview.style.display = "none";
        preview.src = "";
        return;
      }
      status.textContent = `Selected: ${f.name} (${Math.round(f.size/1024)} KB)`;
      preview.src = URL.createObjectURL(f);
      preview.style.display = "block";
    });

    // Save click
    saveBtn.addEventListener("click", async () => {
      const name = (placeNameEl.value || "").trim();
      const desc = (descEl.value || "").trim();
      const file = input.files && input.files[0];

      if (!name && !desc && !file) {
        alert("Please add something to save.");
        return;
      }

      await saveMemory(latlng, name, desc, file || null, selectedIcon);
    });
  });
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[s]));
}
function cssEscape(value) {
  if (window.CSS && CSS.escape) return CSS.escape(value);
  return String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&");
}

function clearUI() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  memoryListEl.innerHTML = "";
}

function addMemoryToUI(mem) {
  const lat = Number(mem.lat);
  const lng = Number(mem.lng);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

  const marker = L.marker([lat, lng], {
    icon: L.divIcon({
      className: "",
      html: `<div style="font-size:16px;">${mem.icon || "📍"}</div>`,
      iconSize: [20, 20]
    })
  }).addTo(map);

  marker.on("click", () => {
    const imgHTML = mem.imageDataURL ? `<img src="${mem.imageDataURL}" class="popup-img">` : "";
    const content = `
      <h4>${escapeHTML(mem.name || "Untitled Place")}</h4>
      ${imgHTML}
      <p>${escapeHTML(mem.desc || "")}</p>
      <small>${escapeHTML(mem.date || "")}</small>
      <button class="deleteBtn" data-id="${mem.id}">Delete</button>
    `;
    marker.bindPopup(content, { maxWidth: 260 }).openPopup();

    setTimeout(() => {
      const btn = document.querySelector(`.deleteBtn[data-id="${cssEscape(mem.id)}"]`);
      if (btn) {
        btn.onclick = async () => {
          if (!confirm("Delete this memory?")) return;
          await idbDelete(mem.id);
          await loadMemories();
          map.closePopup();
        };
      }
    }, 0);
  });

  markers.push(marker);

  const item = document.createElement("div");
  item.className = "memoryItem";
  item.innerText = `${mem.icon || "📍"} ${mem.name || "Untitled Place"}`;
  item.onclick = () => map.setView([lat, lng], 6);
  memoryListEl.prepend(item);
}

async function saveMemory(latlng, name, desc, file, icon) {
  try {
    const id = (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2);

    const mem = {
      id,
      lat: latlng.lat,
      lng: latlng.lng,
      name,
      desc,
      icon,
      date: new Date().toLocaleDateString(),
      imageDataURL: null
    };

    if (file) {
      showSavingOverlay(true, "Processing photo...");
      mem.imageDataURL = await compressToDataURL(file);
    }

    showSavingOverlay(true, "Saving...");
    await idbPut(mem);

    // Instant UI update
    addMemoryToUI(mem);

    showSavingOverlay(false);
    map.closePopup();

    const all = await idbGetAll();
    setStatus(`Storage: <strong>OK</strong> • Saved <strong>${all.length}</strong> memories`);
  } catch (e) {
    showSavingOverlay(false);
    alert("Save failed: " + (e.message || e));
  }
}

async function loadMemories() {
  clearUI();
  const memories = await idbGetAll();
  setStatus(`Storage: <strong>OK</strong> • Loaded <strong>${memories.length}</strong> memories`);
  memories.forEach(addMemoryToUI);
}

/* Start */
storageSelfTest();
</script>
</body>
</html>
