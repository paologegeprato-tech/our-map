<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR WORLD ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{
  margin:0;height:100%;
  background:#0a0e13;color:#f0ebe5;
  font-family:Arial,sans-serif;
}

#intro{
  position:fixed;inset:0;
  background:#0a0e13;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:3000;text-align:center;
}
#intro h1{color:#d4af37;font-size:2.4rem;}
#intro p{color:#ccc;max-width:320px;}
#intro button{
  margin-top:30px;padding:14px 26px;
  background:#d4af37;border:none;
  font-weight:bold;font-size:1.1rem;
  border-radius:8px;cursor:pointer;
}

.header{
  padding:16px;text-align:center;
  background:#1a1a1a;border-bottom:1px solid #333;
}
.header h1{margin:0;color:#d4af37;}

#map{height:calc(100% - 70px);}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.95);
  display:none;align-items:center;justify-content:center;
  z-index:2000;
}
.modal.active{display:flex;}

.modal-content{
  background:#1a1a1a;
  padding:28px;
  width:90%;max-width:420px;
  border-radius:12px;
  border:1px solid #d4af37;
}

input,textarea{
  width:100%;margin-bottom:12px;
  padding:10px;background:#222;
  border:1px solid #555;color:#fff;
  border-radius:6px;
}

.icon-picker{text-align:center;margin-bottom:16px;}
.icon-picker span{
  font-size:1.6rem;margin:0 12px;cursor:pointer;
}
.icon-picker span.selected{transform:scale(1.25);}

button{
  width:100%;padding:14px;
  border:none;border-radius:6px;
  font-weight:bold;cursor:pointer;
}
button.save{background:#d4af37;}
button.cancel{background:#555;margin-top:10px;}
button.delete{background:#8b2d2d;margin-top:10px;}
button:disabled{opacity:.6;cursor:not-allowed;}

/* POPUP */
.leaflet-popup-content{margin:0;}
.popup{max-width:220px;}
.popup img{
  width:100%;max-height:150px;
  object-fit:cover;border-radius:8px;
  margin-bottom:8px;
}
.popup h3{margin:0 0 6px;color:#d4af37;font-size:1rem;}
.popup p{margin:0 0 8px;font-size:.9rem;color:#ddd;}
.popup-actions{text-align:center;}
.popup-actions button{
  width:auto;padding:6px 10px;
  font-size:.8rem;margin:0 4px;
  border-radius:6px;
}

/* ICON FIX */
.emoji-marker{
  background:transparent!important;
  border:none!important;
}
</style>
</head>

<body>

<div id="intro">
  <h1>OUR WORLD ❤️</h1>
  <p>Every place we loved. Every memory we made.</p>
  <button onclick="enterWorld()">Enter Our World ❤️</button>
</div>

<div class="header"><h1>OUR WORLD ❤️</h1></div>
<div id="map"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 style="color:#d4af37;">Add / Edit Memory</h2>
    <input id="name" placeholder="Place name">
    <textarea id="desc" placeholder="Why this place matters"></textarea>
    <input type="file" id="photo" accept="image/*">

    <div class="icon-picker">
      <span onclick="selectIcon('🍔')">🍔</span>
      <span onclick="selectIcon('❤️')" class="selected">❤️</span>
      <span onclick="selectIcon('✈️')">✈️</span>
    </div>

    <button class="save" id="saveBtn" onclick="savePin()">Save ❤️</button>
    <button class="cancel" onclick="closeModal()">Cancel</button>
    <button class="delete" id="deleteBtn" onclick="deletePin()" style="display:none;">Delete Memory</button>
  </div>
</div>

<script>
if(localStorage.getItem('entered')) intro.style.display='none';
function enterWorld(){localStorage.setItem('entered','yes');intro.style.display='none';}

const map=L.map('map').setView([48,8],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let pins=JSON.parse(localStorage.getItem('pins')||'[]');
let tempLatLng,selectedIcon='❤️',imageData=null,editIndex=null;

map.on('click',e=>{
  tempLatLng=e.latlng;
  openModal();
});

function openModal(pin=null,index=null){
  modal.classList.add('active');
  editIndex=index;
  deleteBtn.style.display=index!==null?'block':'none';

  if(pin){
    name.value=pin.name;
    desc.value=pin.desc;
    selectedIcon=pin.icon;
    imageData=pin.img;
    highlightIcon();
  }else{
    name.value='';desc.value='';imageData=null;
  }
}

function closeModal(){
  modal.classList.remove('active');
  editIndex=null;
}

function selectIcon(icon){selectedIcon=icon;highlightIcon();}
