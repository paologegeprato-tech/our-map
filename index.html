<!doctype html>
<html>
<body style="font-family:Arial;padding:20px">
<h2>Storage Test</h2>
<pre id="out">Running...</pre>
<script>
const out = document.getElementById("out");

function log(msg){ out.textContent += msg + "\n"; }

(async () => {
  // localStorage test
  try {
    localStorage.setItem("hello", "world");
    log("localStorage read: " + localStorage.getItem("hello"));
  } catch (e) {
    log("localStorage FAILED: " + e.message);
  }

  // IndexedDB test
  try {
    const req = indexedDB.open("testdb", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("s", { keyPath: "id" });
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction("s", "readwrite");
      tx.objectStore("s").put({ id: "x", ok: true });
      tx.oncomplete = () => log("IndexedDB write: OK");
      tx.onerror = () => log("IndexedDB write FAILED");
    };
    req.onerror = () => log("IndexedDB open FAILED");
  } catch (e) {
    log("IndexedDB FAILED: " + e.message);
  }
})();
</script>
</body>
</html>
