<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR WORLD ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{
  margin:0;
  height:100%;
  font-family:Arial, sans-serif;
  background:#0a0e13;
  color:#f0ebe5;
}

#map{height:100%}
.leaflet-div-icon{background:none;border:none}

/* ---------------- INTRO ---------------- */

#intro{
  position:fixed;
  inset:0;
  background:#0a0e13;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:5000;
  overflow:hidden;
}

#intro::before{
  content:"❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤ ❤";
  position:absolute;
  font-size:4rem;
  color:rgba(139,0,0,0.05);
  animation:floatHearts 18s linear infinite;
}

@keyframes floatHearts{
  0%{transform:translateY(-20px)}
  50%{transform:translateY(40px)}
  100%{transform:translateY(-20px)}
}

#intro h1{
  color:#d4af37;
  font-size:2.4rem;
  z-index:2;
}

#intro p{color:#ccc;z-index:2}

#intro button{
  margin-top:30px;
  padding:14px 26px;
  background:#d4af37;
  border:none;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
  z-index:2;
  transition:0.3s;
}
#intro button:hover{transform:scale(1.05)}

/* ---------------- MODALS ---------------- */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:4000;
}
.modal.active{display:flex}

.modal-content{
  background:#1a1a1a;
  width:90%;
  max-width:420px;
  padding:20px;
  border-radius:12px;
  border:1px solid #d4af37;
  max-height:85vh;
  overflow:auto;
  animation:fadeIn .25s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}

input,textarea{
  width:100%;
  padding:10px;
  margin-bottom:12px;
  background:#222;
  border:1px solid #555;
  color:#fff;
  border-radius:6px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
}

.save{background:#d4af37;color:#000}
.cancel{background:#555;margin-top:8px}
.delete{background:#8b0000;margin-top:8px}

/* ---------------- POPUP ---------------- */

.popup{
  width:260px;
}

.popup img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:6px;
  cursor:pointer;
}

.popup p{
  font-size:.9rem;
  margin:4px 0;
}

.popup button{
  margin-top:6px;
}

/* ---------------- VIEWER ---------------- */

#viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:6000;
}
#viewer img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
}

/* ---------------- LIST BUTTON ---------------- */

#listBtn{
  position:absolute;
  bottom:18px;
  left:18px;
  z-index:3000;
  font-size:1.8rem;
  background:#d4af37;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

/* ---------------- SAVE HEART ANIMATION ---------------- */

@keyframes pulseHeart{
  0%{transform:scale(1)}
  50%{transform:scale(1.4)}
  100%{transform:scale(1)}
}

.heartPulse{
  animation:pulseHeart .6s ease;
}

</style>
</head>

<body>

<div id="intro">
  <h1>OUR WORLD ❤️</h1>
  <p>Every place we loved. Every memory we made.</p>
  <button onclick="enterWorld()">Enter Our World ❤️</button>
</div>

<div id="map"></div>
<button id="listBtn">✈️</button>

<div class="modal" id="memoryModal">
  <div class="modal-content">
    <input id="placeName" placeholder="Place name">
    <textarea id="placeDesc" placeholder="Why this place matters"></textarea>
    <input type="file" id="placePhoto" accept="image/*">
    <button class="save" id="saveBtn">Save ❤️</button>
    <button class="cancel" onclick="closeModal()">Cancel</button>
    <button class="delete" id="deleteBtn">Delete</button>
  </div>
</div>

<div class="modal" id="listModal">
  <div class="modal-content">
    <h3 style="color:#d4af37;">Our Places</h3>
    <ul id="placesList"></ul>
    <button class="cancel" onclick="closeList()">Close</button>
  </div>
</div>

<div id="viewer" onclick="this.style.display='none'">
  <img id="viewerImg">
</div>

<script>

/* -------- INTRO -------- */
function enterWorld(){
  document.getElementById("intro").style.display="none";
  setTimeout(()=>map.invalidateSize(),300);
}

/* -------- MAP -------- */
const map=L.map("map").setView([48,8],4);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

let pins=JSON.parse(localStorage.getItem("pins")||"[]");
let editIndex=null;
let tempLatLng=null;
let imageData=null;

/* -------- IMAGE FAST COMPRESSION -------- */
document.getElementById("placePhoto").addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file) return;

  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement("canvas");
      const max=800;
      let w=img.width,h=img.height;
      if(w>max||h>max){
        if(w>h){h=h*max/w;w=max;}
        else{w=w*max/h;h=max;}
      }
      canvas.width=w;
      canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      imageData=canvas.toDataURL("image/jpeg",0.7);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

/* -------- MAP CLICK -------- */
map.on("click",e=>{
  editIndex=null;
  tempLatLng=e.latlng;
  document.getElementById("deleteBtn").style.display="none";
  openModal();
});

/* -------- SAVE -------- */
document.getElementById("saveBtn").onclick=function(){
  const btn=this;
  btn.textContent="Saving...";
  btn.disabled=true;

  setTimeout(()=>{
    const data={
      lat:editIndex!==null?pins[editIndex].lat:tempLatLng.lat,
      lng:editIndex!==null?pins[editIndex].lng:tempLatLng.lng,
      name:document.getElementById("placeName").value,
      desc:document.getElementById("placeDesc").value,
      img:imageData
    };

    if(editIndex!==null) pins[editIndex]=data;
    else pins.push(data);

    localStorage.setItem("pins",JSON.stringify(pins));
    renderPins();

    btn.classList.add("heartPulse");
    setTimeout(()=>btn.classList.remove("heartPulse"),600);

    closeModal();
    btn.textContent="Save ❤️";
    btn.disabled=false;
  },150);
};

/* -------- DELETE -------- */
document.getElementById("deleteBtn").onclick=function(){
  pins.splice(editIndex,1);
  localStorage.setItem("pins",JSON.stringify(pins));
  renderPins();
  closeModal();
};

/* -------- RENDER -------- */
let markers=[];
function renderPins(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  pins.forEach((p,i)=>{
    const marker=L.marker([p.lat,p.lng],{
      icon:L.divIcon({
        html:`<div style="font-size:18px">❤️</div>`,
        iconSize:[18,18],
        iconAnchor:[9,9]
      })
    }).addTo(map);

    marker.on("click",()=>{
      const popupContent=document.createElement("div");
      popupContent.className="popup";
      popupContent.innerHTML=`
        ${p.img?`<img src="${p.img}" onclick="viewImage('${p.img}')">`:""}
        <strong>${p.name||"Our Memory"}</strong>
        <p>${p.desc||""}</p>
        <button onclick="editPin(${i})">Edit</button>
      `;
      marker.bindPopup(popupContent,{maxWidth:280}).openPopup();
    });

    markers.push(marker);
  });

  renderList();
}
renderPins();

/* -------- EDIT -------- */
function editPin(i){
  editIndex=i;
  const p=pins[i];
  document.getElementById("placeName").value=p.name;
  document.getElementById("placeDesc").value=p.desc;
  imageData=p.img;
  document.getElementById("deleteBtn").style.display="block";
  openModal();
}

/* -------- VIEW IMAGE -------- */
function viewImage(src){
  document.getElementById("viewerImg").src=src;
  document.getElementById("viewer").style.display="flex";
}

/* -------- LIST -------- */
document.getElementById("listBtn").onclick=function(){
  document.getElementById("listModal").classList.add("active");
};

function renderList(){
  const list=document.getElementById("placesList");
  list.innerHTML="";
  pins.forEach(p=>{
    const li=document.createElement("li");
    li.textContent=p.name;
    list.appendChild(li);
  });
}

function closeList(){
  document.getElementById("listModal").classList.remove("active");
}

/* -------- MODAL -------- */
function openModal(){
  document.getElementById("memoryModal").classList.add("active");
}
function closeModal(){
  document.getElementById("memoryModal").classList.remove("active");
}

</script>
</body>
</html>
