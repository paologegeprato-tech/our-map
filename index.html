<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Our World ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html,body{margin:0;padding:0;height:100%;font-family:Arial,sans-serif;overflow:hidden;}

/* Top Status */
#statusBar{
  position:fixed;left:0;top:0;width:100%;
  background:#111;color:#fff;opacity:.9;
  z-index:9000;padding:10px 12px;box-sizing:border-box;font-size:14px;
}
#statusBar strong{color:#ff4d6d;}

/* Intro */
#intro{
  position:fixed;inset:0;
  background:#2a0000;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  color:white;z-index:9999;text-align:center;
  padding:24px;box-sizing:border-box;
}
#intro h1{margin:0 0 10px;font-size:34px;}
#intro .tagline{margin:0 0 16px;font-size:16px;opacity:.95;max-width:520px;}
#intro .fox{font-size:42px;margin:0 0 18px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));}
#enterBtn{
  padding:12px 25px;font-size:18px;border:none;border-radius:30px;
  background:#ff4d6d;color:white;cursor:pointer;
}
#enterBtn:hover{background:#ff6382;}

#map{height:100%;width:100%;}

/* Smaller toggle button */
#memoriesToggle{
  position:fixed;top:58px;right:10px;
  background:rgba(255,77,109,0.9);
  color:white;border:none;border-radius:999px;
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:16px;
  cursor:pointer;z-index:850;
  box-shadow:0 4px 10px rgba(0,0,0,0.25);
}
#memoriesToggle:active{transform:scale(0.97);}

/* Slide Panel */
#sidePanel{
  position:fixed;top:104px;right:-270px;
  width:240px;max-height:68%;overflow:auto;
  background:rgba(25, 8, 12, 0.75);
  color:#fff;border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border-radius:18px;padding:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
  z-index:800;transition:right 0.28s ease;
}
#sidePanel.open{right:10px;}
#sidePanel h3{margin:4px 0 10px;font-weight:700;font-size:16px;}

.memoryItem{
  padding:8px 6px;border-bottom:1px solid rgba(255,255,255,0.12);
  cursor:pointer;font-size:14px;color:#fff;
}
.memoryItem:hover{background:rgba(255,255,255,0.08);border-radius:10px;}

.leaflet-popup-content-wrapper{border-radius:15px;width:260px!important;}
.popup-img{width:100%;max-height:150px;object-fit:contain;border-radius:10px;}

.saveBtn,.deleteBtn{
  margin-top:8px;padding:8px;border:none;color:white;border-radius:10px;
  cursor:pointer;width:100%;
}
.saveBtn{background:#ff4d6d;}
.saveBtn:hover{background:#ff6382;}
.deleteBtn{background:#666;}
.deleteBtn:hover{background:#777;}

.iconChoice{font-size:20px;cursor:pointer;margin:5px;}
.iconChoice.selected{text-shadow:0 0 8px rgba(255,77,109,0.9);}

/* Saving overlay */
#savingOverlay{
  position:fixed;inset:0;
  display:flex;justify-content:center;align-items:center;
  background:rgba(0,0,0,0.5);color:white;font-size:20px;
  z-index:2000;display:none;
}
.heartbeat{animation:beat .6s infinite alternate;}
@keyframes beat{from{transform:scale(1);}to{transform:scale(1.3);}}

/* Floating hearts */
.heart{
  position:absolute;font-size:22px;pointer-events:none;z-index:1200;
  animation:floatUp 900ms ease-out forwards;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,0.35));
}
@keyframes floatUp{
  0%{transform:translateY(0) scale(1);opacity:1;}
  100%{transform:translateY(-60px) scale(1.6);opacity:0;}
}
</style>
</head>

<body>
<div id="statusBar">Ready</div>

<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <p class="tagline">for the memories of yesterday, today, tomorrow and forever .</p>
  <div class="fox">🦊</div>
  <button id="enterBtn" type="button">Enter Our World</button>
</div>

<button id="memoriesToggle" type="button" aria-label="Toggle memories">💌</button>

<div id="sidePanel">
  <h3>Our Memories</h3>
  <div id="memoryList"></div>
</div>

<div id="map"></div>

<div id="savingOverlay"><span class="heartbeat">💾</span></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* ===================== Safety: show errors (helps if Safari stops script) ===================== */
window.addEventListener("error", function(e){
  alert("Error: " + (e.message || "Unknown error"));
});
window.addEventListener("unhandledrejection", function(e){
  alert("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

/* ===================== Local Storage ===================== */
const STORE_KEY = "ourworld_memories_v7";

function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); }
  catch { return []; }
}
function saveStore(arr){
  localStorage.setItem(STORE_KEY, JSON.stringify(arr));
}
function addToStore(mem){
  const all = loadStore();
  all.push(mem);
  saveStore(all);
  return all.length;
}
function deleteFromStore(id){
  const all = loadStore().filter(function(m){ return m.id !== id; });
  saveStore(all);
  return all.length;
}

/* ===================== UI ===================== */
var statusBar = document.getElementById("statusBar");
var memoryListEl = document.getElementById("memoryList");
var panel = document.getElementById("sidePanel");
var toggle = document.getElementById("memoriesToggle");

function setStatus(html){ statusBar.innerHTML = html; }
function showSavingOverlay(show, text){
  var o = document.getElementById("savingOverlay");
  o.style.display = show ? "flex" : "none";
  if (show) o.innerHTML = '<span class="heartbeat">' + (text || "Working...") + '</span>';
}

/* Toggle panel */
toggle.addEventListener("click", function(){
  panel.classList.toggle("open");
});

/* ===================== Photo compression ===================== */
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise(function(_, reject){
      setTimeout(function(){ reject(new Error(label || "Timed out")); }, ms);
    })
  ]);
}

async function compressToDataURL(file){
  var MAX_WIDTH = 420;
  var QUALITY = 0.33;

  var img = new Image();
  img.src = URL.createObjectURL(file);
  await withTimeout(img.decode(), 9000, "Photo decode took too long");

  var scale = Math.min(1, MAX_WIDTH / img.width);
  var w = Math.max(1, Math.round(img.width * scale));
  var h = Math.max(1, Math.round(img.height * scale));

  var canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);

  URL.revokeObjectURL(img.src);

  return canvas.toDataURL("image/jpeg", QUALITY);
}

/* ===================== Floating hearts ===================== */
function showHeartTrail(latlng, icon){
  if (!map) return;

  var mapDiv = document.getElementById("map");
  var p = map.latLngToContainerPoint(latlng);
  var emojis = (icon === "❤️") ? ["❤️","💕","💞","💖"] : ["✨","💫","🌟"];

  for (var i = 0; i < 4; i++){
    var h = document.createElement("div");
    h.className = "heart";
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = (p.x + (Math.random() * 34 - 17)) + "px";
    h.style.top  = (p.y + (Math.random() * 34 - 17)) + "px";
    h.style.animationDelay = (i * 0.08) + "s";
    mapDiv.appendChild(h);
    (function(node){
      setTimeout(function(){ node.remove(); }, 1100);
    })(h);
  }
}

/* ===================== Map ===================== */
var map = null;
var markers = [];

/* IMPORTANT: bind Enter button AFTER DOM is ready */
document.addEventListener("DOMContentLoaded", function(){
  var enterBtn = document.getElementById("enterBtn");
  enterBtn.addEventListener("click", function(){
    document.getElementById("intro").style.display = "none";
    initMap();
    renderAll();
  });
});

function initMap(){
  if (map) return; // prevent double init

  map = L.map("map").setView([20, 0], 2);

  // Smooth dark tiles (removes seams/grid lines on iPhone)
  L.tileLayer(
    "https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png",
    {
      maxZoom: 20,
      tileSize: 512,
      zoomOffset: -1,
      detectRetina: true,
      attribution: '&copy; OpenStreetMap contributors &copy; Stadia Maps'
    }
  ).addTo(map);

  map.on("click", function(e){
    openMemoryPopup(e.latlng);
  });

  setStatus('Saved <strong>' + loadStore().length + '</strong> memories');
}

function clearUI(){
  for (var i = 0; i < markers.length; i++){
    map.removeLayer(markers[i]);
  }
  markers = [];
  memoryListEl.innerHTML = "";
}

function addMemoryToUI(mem){
  var marker = L.marker([mem.lat, mem.lng], {
    icon: L.divIcon({
      className: "",
      html: '<div style="font-size:16px;">' + mem.icon + '</div>',
      iconSize: [20, 20]
    })
  }).addTo(map);

  marker.on("click", function(){
    var imgHTML = mem.imageDataURL ? '<img src="' + mem.imageDataURL + '" class="popup-img">' : "";
    var content =
      '<h4>' + (mem.name || "Untitled Place") + '</h4>' +
      imgHTML +
      '<p>' + (mem.desc || "") + '</p>' +
      '<small>' + (mem.date || "") + '</small>' +
      '<button class="deleteBtn" data-id="' + mem.id + '">Delete</button>';

    marker.bindPopup(content, { maxWidth: 260 }).openPopup();

    setTimeout(function(){
      var btn = document.querySelector('.deleteBtn[data-id="' + mem.id + '"]');
      if (btn){
        btn.onclick = function(){
          deleteFromStore(mem.id);
          renderAll();
          map.closePopup();
        };
      }
    }, 0);
  });

  markers.push(marker);

  var item = document.createElement("div");
  item.className = "memoryItem";
  item.innerText = mem.icon + " " + (mem.name || "Untitled Place");
  item.onclick = function(){
    map.setView([mem.lat, mem.lng], 6);
    panel.classList.add("open");
  };
  memoryListEl.prepend(item);
}

function renderAll(){
  if (!map) return;
  clearUI();
  var all = loadStore();
  for (var i = 0; i < all.length; i++){
    addMemoryToUI(all[i]);
  }
  setStatus('Saved <strong>' + all.length + '</strong> memories');
}

/* ===================== Popup ===================== */
function openMemoryPopup(latlng){
  var wrap = document.createElement("div");

  wrap.innerHTML =
    '<input class="placeName" placeholder="Place name" style="width:100%;margin-bottom:5px;">' +
    '<textarea class="description" placeholder="Description" style="width:100%;height:60px;"></textarea>' +
    '<input type="file" class="photoInput" accept="image/*">' +
    '<div class="photoStatus" style="font-size:12px;color:#555;margin-top:4px;">No photo selected</div>' +
    '<img class="photoPreview popup-img" style="display:none;margin-top:6px;">' +
    '<div>' +
      '<span class="iconChoice selected">❤️</span>' +
      '<span class="iconChoice">🍔</span>' +
      '<span class="iconChoice">✈️</span>' +
    '</div>' +
    '<button type="button" class="saveBtn">Save</button>';

  var popup = L.popup({ maxWidth: 260 })
    .setLatLng(latlng)
    .setContent(wrap)
    .openOn(map);

  var selectedIcon = "❤️";

  var iconChoices = wrap.querySelectorAll(".iconChoice");
  for (var i = 0; i < iconChoices.length; i++){
    iconChoices[i].onclick = (function(node){
      return function(){
        for (var j = 0; j < iconChoices.length; j++){
          iconChoices[j].classList.remove("selected");
        }
        node.classList.add("selected");
        selectedIcon = node.textContent;
      };
    })(iconChoices[i]);
  }

  var input = wrap.querySelector(".photoInput");
  var preview = wrap.querySelector(".photoPreview");
  var status = wrap.querySelector(".photoStatus");

  input.onchange = function(){
    var f = input.files && input.files[0];
    if (!f){
      preview.style.display = "none";
      return;
    }
    preview.src = URL.createObjectURL(f);
    preview.style.display = "block";
    status.textContent = "Selected: " + f.name;
  };

  wrap.querySelector(".saveBtn").onclick = async function(){
    var name = wrap.querySelector(".placeName").value.trim();
    var desc = wrap.querySelector(".description").value.trim();
    var file = input.files && input.files[0];

    if (!name && !desc && !file){
      alert("Please add something to save.");
      return;
    }

    showSavingOverlay(true, file ? "Processing photo..." : "Saving...");
    var imageDataURL = null;
    if (file){
      imageDataURL = await compressToDataURL(file);
    }

    var id = (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : (String(Date.now()) + Math.random().toString(16).slice(2));

    var mem = {
      id: id,
      lat: latlng.lat,
      lng: latlng.lng,
      name: name,
      desc: desc,
      icon: selectedIcon,
      date: new Date().toLocaleDateString(),
      imageDataURL: imageDataURL
    };

    addToStore(mem);
    addMemoryToUI(mem);
    showHeartTrail(latlng, selectedIcon);

    showSavingOverlay(false);
    map.closePopup(popup);
    setStatus('Saved <strong>' + loadStore().length + '</strong> memories');
  };
}
</script>

</body>
</html>
