<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Our World ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  font-family: Arial, sans-serif;
  overflow:hidden;
}

/* Romantic intro */
#intro {
  position:fixed;
  width:100%;
  height:100%;
  background:#3b0000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:9999;
  text-align:center;
}

#intro h1 {
  font-size:2em;
  margin-bottom:20px;
}

#enterBtn {
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}

/* Map */
#map {
  height:100%;
  width:100%;
}

/* Side panel */
#sidePanel {
  position:fixed;
  top:10px;
  right:10px;
  width:220px;
  max-height:80%;
  overflow:auto;
  background:white;
  border-radius:15px;
  padding:10px;
  z-index:800;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.memoryItem {
  padding:6px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

/* Popup styling */
.leaflet-popup-content-wrapper {
  border-radius:15px;
}

.popup-img {
  width:100%;
  height:200px;
  object-fit:contain;
  border-radius:10px;
}

.iconChoice {
  font-size:22px;
  cursor:pointer;
  margin:5px;
}

.saveBtn {
  margin-top:8px;
  padding:8px;
  background:#ff4d6d;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
  width:100%;
}

.deleteBtn {
  margin-top:5px;
  padding:6px;
  background:#999;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
  width:100%;
}

</style>
</head>
<body>

<div id="intro">
  <h1>Welcome to Our World ❤️</h1>
  <button id="enterBtn">Enter Our World</button>
</div>

<div id="map"></div>

<div id="sidePanel">
  <h3>Our Memories</h3>
  <div id="memoryList"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let map;
let memories = JSON.parse(localStorage.getItem("memories") || "[]");
let markers = [];

document.getElementById("enterBtn").addEventListener("click", function(){
  document.getElementById("intro").style.display = "none";
  if(!mapInitialized){
    initMap();
    mapInitialized = true;
  }
});

let mapInitialized = false;

function initMap(){
  map = L.map('map').setView([20,0],2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:18
  }).addTo(map);

  map.on("click", function(e){
    openMemoryPopup(e.latlng);
  });

  loadMemories();
}

function openMemoryPopup(latlng, existing=null){

  let popupContent = `
    <input id="placeName" placeholder="Place name" style="width:100%;margin-bottom:5px;" value="${existing?existing.name:""}">
    <textarea id="description" placeholder="Description" style="width:100%;height:60px;">${existing?existing.desc:""}</textarea>
    <input type="file" id="photoInput" accept="image/*">
    <div>
      <span class="iconChoice">❤️</span>
      <span class="iconChoice">🍔</span>
      <span class="iconChoice">✈️</span>
    </div>
    <button class="saveBtn">Save</button>
    ${existing?'<button class="deleteBtn">Delete</button>':''}
  `;

  let popup = L.popup({maxWidth:300})
    .setLatLng(latlng)
    .setContent(popupContent)
    .openOn(map);

  let selectedIcon = "❤️";

  setTimeout(()=>{
    document.querySelectorAll(".iconChoice").forEach(icon=>{
      icon.onclick=()=> selectedIcon = icon.textContent;
    });

    document.querySelector(".saveBtn").onclick = function(){
      let name = document.getElementById("placeName").value;
      let desc = document.getElementById("description").value;
      let file = document.getElementById("photoInput").files[0];

      if(file){
        let reader = new FileReader();
        reader.onload = function(evt){
          saveMemory(latlng,name,desc,evt.target.result,selectedIcon);
        };
        reader.readAsDataURL(file);
      } else {
        saveMemory(latlng,name,desc,null,selectedIcon);
      }
    };

    if(existing){
      document.querySelector(".deleteBtn").onclick=function(){
        memories = memories.filter(m=>m.id!==existing.id);
        localStorage.setItem("memories",JSON.stringify(memories));
        map.closePopup();
        loadMemories();
      };
    }

  },100);
}

function saveMemory(latlng,name,desc,image,icon){
  let memory = {
    id: Date.now(),
    lat:latlng.lat,
    lng:latlng.lng,
    name:name,
    desc:desc,
    image:image,
    icon:icon,
    date:new Date().toLocaleDateString()
  };
  memories.push(memory);
  localStorage.setItem("memories",JSON.stringify(memories));
  map.closePopup();
  loadMemories();
}

function loadMemories(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  document.getElementById("memoryList").innerHTML="";

  memories.forEach(mem=>{
    let marker = L.marker([mem.lat,mem.lng],{
      icon:L.divIcon({
        className:"",
        html:`<div style="font-size:18px;">${mem.icon}</div>`
      })
    }).addTo(map);

    marker.on("click",()=>{
      let content=`
        <h3>${mem.name}</h3>
        ${mem.image?`<img src="${mem.image}" class="popup-img">`:""}
        <p>${mem.desc}</p>
        <small>${mem.date}</small>
      `;
      marker.bindPopup(content,{maxWidth:300}).openPopup();
    });

    markers.push(marker);

    let item = document.createElement("div");
    item.className="memoryItem";
    item.innerText=mem.icon+" "+mem.name;
    item.onclick=()=>map.setView([mem.lat,mem.lng],6);
    document.getElementById("memoryList").appendChild(item);
  });
}
</script>

</body>
</html>
