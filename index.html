<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR WORLD ❤️</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; height:100%; background:#0a0e13; color:#f0ebe5; font-family:Arial,sans-serif; }

#intro {
  position:fixed; inset:0; background:#0a0e13;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:3000; text-align:center;
}
#intro h1 { color:#d4af37; font-size:2.4rem; margin-bottom:10px; }
#intro p { max-width:300px; color:#ccc; }
#intro button {
  margin-top:30px; padding:14px 24px;
  font-size:1.1rem; font-weight:bold;
  border:none; border-radius:8px;
  background:#d4af37; cursor:pointer;
}

.header {
  padding:16px; text-align:center;
  background:#1a1a1a; border-bottom:1px solid #333;
}
.header h1 { margin:0; color:#d4af37; }

#map { height:calc(100% - 70px); }

.modal {
  position:fixed; inset:0; background:rgba(0,0,0,.95);
  display:none; align-items:center; justify-content:center;
  z-index:2000;
}
.modal.active { display:flex; }

.modal-content {
  background:#1a1a1a; padding:30px;
  width:90%; max-width:420px;
  border-radius:12px; border:1px solid #d4af37;
}
.modal-content h2 { color:#d4af37; }

input, textarea {
  width:100%; margin-bottom:12px;
  padding:10px; background:#222;
  border:1px solid #555; color:#fff;
  border-radius:6px;
}

.icon-picker span {
  font-size:2rem; margin:0 10px;
  cursor:pointer;
}
.icon-picker span.selected {
  transform:scale(1.3);
}

button.save {
  width:100%; padding:14px;
  background:#d4af37; border:none;
  font-weight:bold; border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="intro">
  <h1>OUR WORLD ❤️</h1>
  <p>Every place we loved. Every memory we made.</p>
  <button onclick="enterWorld()">Enter Our World ❤️</button>
</div>

<div class="header">
  <h1>OUR WORLD ❤️</h1>
</div>
<div id="map"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2>Add Memory</h2>
    <input id="name" placeholder="Place name">
    <textarea id="desc" placeholder="Why this place matters"></textarea>
    <input type="file" id="photo" accept="image/*">

    <div class="icon-picker">
      <span onclick="selectIcon('🍔')">🍔</span>
      <span onclick="selectIcon('❤️')">❤️</span>
      <span onclick="selectIcon('✈️')">✈️</span>
    </div>

    <button class="save" onclick="savePin()">Save ❤️</button>
  </div>
</div>

<script>
if(localStorage.getItem('entered')) {
  document.getElementById('intro').style.display='none';
}

function enterWorld(){
  localStorage.setItem('entered','yes');
  document.getElementById('intro').style.display='none';
}

const map = L.map('map').setView([48,8],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let pins = JSON.parse(localStorage.getItem('pins')||'[]');
let tempLatLng = null;
let selectedIcon = '❤️';
let imageData = null;

function selectIcon(icon){
  selectedIcon = icon;
  document.querySelectorAll('.icon-picker span').forEach(s=>s.classList.remove('selected'));
  [...document.querySelectorAll('.icon-picker span')].find(s=>s.textContent===icon).classList.add('selected');
}

map.on('click', e=>{
  tempLatLng = e.latlng;
  document.getElementById('modal').classList.add('active');
});

document.getElementById('photo').addEventListener('change', e=>{
  const reader = new FileReader();
  reader.onload = ev => imageData = ev.target.result;
  reader.readAsDataURL(e.target.files[0]);
});

function savePin(){
  const pin = {
    lat: tempLatLng.lat,
    lng: tempLatLng.lng,
    name: name.value,
    desc: desc.value,
    icon: selectedIcon,
    img: imageData
  };
  pins.push(pin);
  localStorage.setItem('pins', JSON.stringify(pins));
  addMarker(pin);
  document.getElementById('modal').classList.remove('active');
}

function addMarker(p){
  const icon = L.divIcon({ html:`<div style="font-size:2rem">${p.icon}</div>` });
  const m = L.marker([p.lat,p.lng],{icon}).addTo(map);
  m.bindPopup(`<b>${p.name}</b><br>${p.desc}<br>${p.img?`<img src="${p.img}" style="width:100%;border-radius:6px">`:''}`);
}

pins.forEach(addMarker);
</script>

</body>
</html>
